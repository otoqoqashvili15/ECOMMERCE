services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-StoreLocal!ChangeMe2026}"
    ports:
      - "1433:1433"
    volumes:
      - ecommerce-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    restart: unless-stopped

  api:
    build:
      context: ./Back/Ecommerce
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=EcommerceStore;User Id=sa;Password=${MSSQL_SA_PASSWORD:-StoreLocal!ChangeMe2026};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True"
      Jwt__Issuer: Ecommerce.Api
      Jwt__Audience: Ecommerce.Frontend
      Jwt__Secret: "${JWT_SECRET:-Atelier-JWT-Dev-2026-Secret-Key1}"
      Store__TaxRate: "${STORE_TAX_RATE:-0.08}"
      Seed__AdminEmail: "${ADMIN_EMAIL:-admin@atelier.local}"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-AtelierDev!2026}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ecommerce-sql-data:
